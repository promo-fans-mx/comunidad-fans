<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facebook</title>
<style>
body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#f0f2f5;text-align:center;padding:70px 24px}
img{height:44px;margin-bottom:28px}
h1{font-size:20px;margin:0 0 24px}
a{display:inline-block;padding:14px 26px;background:#1877f2;color:#fff;font-weight:700;text-decoration:none;border-radius:8px}
</style>
</head>
<body>
<img src="logo.png" alt="Facebook">
<h1 id="h1">¡Listo! Ya estás dentro de la comunidad.</h1>
<a id="btn" href="https://www.facebook.com">Ir a Facebook</a>
<script>
var S={
es:{h1:"¡Listo! Ya estás dentro de la comunidad.",btn:"Ir a Facebook"},
en:{h1:"Done! You're in the community.",btn:"Go to Facebook"},
pt:{h1:"Pronto! Você está na comunidade.",btn:"Ir para o Facebook"},
fr:{h1:"C'est fait ! Vous êtes dans la communauté.",btn:"Aller sur Facebook"},
de:{h1:"Fertig! Du bist in der Community.",btn:"Zu Facebook"},
it:{h1:"Fatto! Sei nella community.",btn:"Vai su Facebook"},
ru:{h1:"Готово! Вы в сообществе.",btn:"Перейти в Facebook"},
ar:{h1:"تم! أنت داخل المجتمع.",btn:"الانتقال إلى Facebook"},
hi:{h1:"हो गया! आप समुदाय में हैं।",btn:"Facebook पर जाएँ"},
zh:{h1:"完成！你已加入社区。",btn:"前往 Facebook"}
};

var SUP=["es","en","pt","fr","de","it","ru","ar","hi","zh"];
var raw=(navigator.languages&&navigator.languages[0])||navigator.language||"es";
var ov=(location.search.match(/[?&]l=([a-zA-Z-]+)/)||[])[1];
if(ov)raw=ov;
var base=raw.toLowerCase().split("-")[0];
var lang=SUP.indexOf(base)>=0?base:"es";
var L=S[lang];

document.documentElement.lang=lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.getElementById("h1").textContent=L.h1;
document.getElementById("btn").textContent=L.btn;
</script>
</body>
</html>
